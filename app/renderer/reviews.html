<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Claude reviews</title>
<style>
  body{margin:0;padding:20px;background:#0b0d10;color:#d8dde3;font:14px/1.5 system-ui,Segoe UI,sans-serif}
  h1{font-size:18px;margin:0 0 4px} h2{font-size:14px;margin:24px 0 8px;color:#8b95a1;text-transform:uppercase;letter-spacing:.06em}
  .sub{color:#8b95a1;margin-bottom:16px}
  .card{background:#14181d;border:1px solid #232a32;border-radius:8px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1} .muted{color:#8b95a1;font-size:12px} .err{color:#ff8a80}
  button{background:#2a3340;color:#d8dde3;border:1px solid #374253;border-radius:6px;padding:4px 12px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  input[type=number]{width:60px;background:#0b0d10;color:#d8dde3;border:1px solid #374253;border-radius:4px;padding:2px 4px}
  .sev{display:inline-block;min-width:44px;text-align:center;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;margin-right:6px}
  .high{background:#5c1f1f;color:#ffb4ab}.med{background:#5a4a14;color:#ffd97a}.low{background:#27323f;color:#9fb3c8}
  pre{white-space:pre-wrap;font:inherit;margin:6px 0 0}
</style></head><body>
<h1>Claude reviews</h1>
<div class="sub" id="sub"></div>
<h2>Behavior reviewer</h2><div id="reviewer"></div>
<h2>Triggers</h2><div id="triggers"></div>
<h2>Recent reviews</h2><div id="reviews"></div>
<script src="reviews.js"></script>
</body></html>
