<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Memory loop</title>
<style>
  body{margin:0;padding:20px;background:#0b0d10;color:#d8dde3;font:14px/1.5 system-ui,Segoe UI,sans-serif}
  h1{font-size:18px;margin:0 0 4px} h2{font-size:14px;margin:24px 0 8px;color:#8b95a1;text-transform:uppercase;letter-spacing:.06em}
  .sub{color:#8b95a1;margin-bottom:16px;max-width:980px}
  .card{background:#14181d;border:1px solid #232a32;border-radius:8px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1} .muted{color:#8b95a1;font-size:12px} .err{color:#ff8a80} .ok{color:#7ee0a1}
  button{background:#2a3340;color:#d8dde3;border:1px solid #374253;border-radius:6px;padding:4px 12px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  input[type=text]{width:420px;max-width:100%;background:#0b0d10;color:#d8dde3;border:1px solid #374253;border-radius:4px;padding:2px 6px}
  input[type=number]{width:64px;background:#0b0d10;color:#d8dde3;border:1px solid #374253;border-radius:4px;padding:2px 4px}
  .pill{display:inline-block;min-width:58px;text-align:center;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;margin-right:8px;background:#27323f;color:#9fb3c8}
  .pill.cost{background:#5a4a14;color:#ffd97a} .pill.closed{background:#1c3327;color:#7ee0a1}
  pre{white-space:pre-wrap;font:inherit;margin:6px 0 0}
  pre.file{font:12px/1.5 ui-monospace,Consolas,monospace;color:#c3ccd6;max-height:420px;overflow:auto;background:#0b0d10;border:1px solid #232a32;border-radius:6px;padding:10px}
  table{border-collapse:collapse;width:100%} td,th{text-align:left;padding:4px 10px 4px 0;vertical-align:top;font-size:13px;border-bottom:1px solid #1c2229} th{color:#8b95a1;font-weight:500;font-size:12px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:10px}
  details summary{cursor:pointer;color:#8b95a1;font-size:12px;margin-top:6px}
</style></head><body>
<h1>Memory loop</h1>
<div class="sub" id="sub"></div>
<h2>Digest</h2><div id="digest"></div>
<h2>Scheduled jobs</h2><div id="jobs"></div>
<h2>Work orders</h2><div id="orders"></div>
<h2>Each bot's memory</h2><div id="bots" class="cols"></div>
<h2>Runs</h2><div id="runs"></div>
<script src="loop.js"></script>
</body></html>
