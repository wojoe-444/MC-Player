<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Tabs</title>
<style>
  html,body{margin:0;height:100%;background:#10141a;overflow:hidden;user-select:none}
  body{display:flex;align-items:flex-end;gap:2px;padding:0 10px;border-bottom:1px solid #232a32;font:14px system-ui,Segoe UI,sans-serif}
  button{position:relative;background:none;color:#8b95a1;border:0;border-bottom:2px solid transparent;padding:10px 16px 8px;font:inherit;cursor:pointer}
  button:hover{color:#d8dde3}
  button.on{color:#fff;border-bottom-color:#4da3ff}
  .dot{display:none;position:absolute;top:8px;right:6px;width:8px;height:8px;border-radius:50%;background:#ffb020}
  .dot.show{display:block}
</style></head><body>
<script src="tabs.js"></script>
</body></html>
