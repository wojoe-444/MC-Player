<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Settings</title>
<style>
  body{margin:0;padding:20px;background:#0b0d10;color:#d8dde3;font:14px/1.5 system-ui,Segoe UI,sans-serif}
  h1{font-size:18px;margin:0 0 4px} h2{font-size:14px;margin:24px 0 8px;color:#8b95a1;text-transform:uppercase;letter-spacing:.06em}
  .card{background:#14181d;border:1px solid #232a32;border-radius:8px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1} .muted{color:#8b95a1;font-size:12px} .err{color:#ff8a80} .ok{color:#7ee0a1}
  button{background:#2a3340;color:#d8dde3;border:1px solid #374253;border-radius:6px;padding:5px 14px;cursor:pointer}
  button.primary{background:#1f6f43;border-color:#2a8f58;color:#fff}
  button:disabled{opacity:.5;cursor:default}
  progress{width:100%;height:8px;margin-top:8px}
  pre{white-space:pre-wrap;font:inherit;margin:8px 0 0;max-height:160px;overflow:auto}
  code{color:#9fb3c8}
</style></head><body>
<h1>Settings</h1>
<div class="muted" id="sub"></div>
<h2>Updates</h2>
<div class="card">
  <div class="row"><b id="version"></b><span class="grow"></span>
    <button id="check">Check for updates</button>
    <button id="install" class="primary" hidden>Update and restart</button></div>
  <div id="status" class="muted" style="margin-top:6px"></div>
  <progress id="bar" max="100" value="0" hidden></progress>
  <pre id="notes" class="muted" hidden></pre>
</div>
<script src="settings.js"></script>
</body></html>
