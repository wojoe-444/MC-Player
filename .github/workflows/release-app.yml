# Builds the Windows installer for the Bot Dashboard app and publishes it as a GitHub release.
# The installed app's Settings > "Check for updates" reads the latest release (electron-updater) and
# "Update and restart" downloads and runs that installer. Version = 0.1.<run number>, always newer than a local 0.1.0 build.
name: Release Bot Dashboard app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'dashboard/**'
      - 'reviewer/**'
      - '.github/workflows/release-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Install reviewer dependencies
        working-directory: reviewer
        run: npm ci --omit=dev
      - name: Built dashboard is complete
        run: node tools/check-dist.js
      - name: Dashboard server files are all shipped
        run: node tools/check-package.js
      - name: App tests
        working-directory: app
        run: npm test
      - name: Set the release version
        working-directory: app
        run: npm pkg set version=0.1.${{ github.run_number }}
      # electron-builder uploads the installer and the blockmap in parallel and both try to create the release,
      # which races (422 "Published releases must have a valid tag") and leaves a release without latest.yml.
      # Creating the release first means it only uploads assets.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v0.1.${{ github.run_number }}" --target "${{ github.sha }}" --title "0.1.${{ github.run_number }}" --notes "Bot Dashboard installer built from ${{ github.sha }}"
      - name: Build and publish the installer
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
